# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      # The game test log only says how many tests failed; the names and messages are in the JUnit report.
      - name: list failed game tests
        if: failure()
        run: |
          python3 - <<'EOF'
          import os, xml.etree.ElementTree as ET
          path = 'build/gametest-report.xml'
          if not os.path.exists(path):
              print('no game test report')
              raise SystemExit
          lines = []
          for case in ET.parse(path).getroot().iter('testcase'):
              for bad in list(case.findall('failure')) + list(case.findall('error')):
                  message = (bad.get('message') or bad.text or '').strip().replace('\n', ' ')[:500]
                  lines.append(f"{case.get('classname', '')} {case.get('name')}: {message}")
                  print(f"::error title=game test failed::{case.get('name')}: {message}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Failed game tests\n\n' + ('\n'.join(f'- {l}' for l in lines) or 'none found in the report') + '\n')
          EOF
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: capture game test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-report
          path: |
            build/gametest-report.xml
            build/run/gameTest/logs/
          if-no-files-found: ignore
